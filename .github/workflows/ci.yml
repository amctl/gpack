name: CI

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
            wip: false
          # macOS and Windows native builds are WIP until verified on hosted runners.
          - os: macos-15
            cc: clang
            wip: true
          - os: windows-2022
            cc: cl
            wip: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.wip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache pinned Goose v2026.4
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: goose-src
          key: ${{ runner.os }}-${{ runner.arch }}-goose-v2026.4
      - name: Install pinned Goose v2026.4
        if: steps.cache-goose.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v2026.4 https://github.com/aardappel/goose.git goose-src
          cmake -S goose-src -B goose-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build goose-src/build --config Release --parallel
      - name: Run native checks
        shell: bash
        env:
          GOOSE: ${{ runner.os == 'Windows' && 'goose-src/build/Release/goose.exe' || 'goose-src/build/goose' }}
        run: python scripts/gpack.py ci
      - name: Print Goose CMake logs on failure
        if: failure()
        shell: bash
        run: |
          find "${USERPROFILE:-$HOME}/.goose" -name "cmake-build.log" -exec head -n 200 {} + 2>/dev/null || true
