project: gpack
question: >-
  What design for a high-throughput, deterministic, safe binary asset packer is
  supported by prior packers, analogous implementations, and Goose's actual
  language/runtime constraints?
status: bootstrap_complete
updated: 2026-11-22
scope:
  - Review the existing PRODUCT.md proposal against primary-source prior art.
  - Inspect the bundled Goose language docs, stdlib, and sample programs.
  - Identify architecture constraints, risks, and testable next hypotheses.
current_understanding: >-
  The repository contains no gpack implementation. PRODUCT.md is a proposed
  architecture, and goose-bin is a bundled Goose compiler/toolchain with sample
  programs and design documentation. Goose can express parsing, indexing,
  serialization, and small flat-message worker pipelines, but its current os
  API reads whole files and its thread queues copy flat messages. A native C
  I/O/codec boundary is likely needed for a scalable streaming packer.
literature: literature/survey.md
experiments:
  completed: []
  next:
    - hypothesis: H1
      title: >-
        Ordered parallel compression is deterministic, but copying chunk-sized
        payloads through Goose queues makes throughput and memory scale poorly.
      proxy: >-
        Peak resident memory and pack throughput versus worker count and chunk
        size, compared with a single-thread and direct-C baseline.
      protocol: experiments/h1-queue-payload-cost/protocol.md
    - hypothesis: H2
      title: >-
        Whole-file independent frames provide a better first format baseline
        than fixed-size chunks for the bundled asset workloads.
      proxy: >-
        Archive size, selective extraction latency, verification time, and peak
        memory over representative small-file and large-file corpora.
      protocol: experiments/h2-frame-granularity/protocol.md
    - hypothesis: H3
      title: >-
        A small native streaming I/O and codec ABI can preserve Goose-side
        format logic while avoiding whole-file reads and large queue copies.
      proxy: >-
        End-to-end throughput, peak memory, and complexity against an all-Goose
        prototype and a C reference implementation.
continuity:
  mechanism_available: false
  note: >-
    This Codex session exposes no Claude /loop or OpenClaw cron tool. Bootstrap
    notes are persisted here for a later session; no recurring job was created.
evaluation:
  baseline: Not measured; this repository has no gpack executable yet.
  metrics:
    - archive correctness and deterministic byte equality
    - pack and extract throughput
    - peak resident memory
    - compression ratio
    - random lookup/extract latency
    - malformed archive rejection
  status: Locked as proposed metrics; implementation and corpora remain open.
next_action: Write experiment protocols before implementing any benchmarked change.
