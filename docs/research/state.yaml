experiments:
  completed:
    - hypothesis: product-v1-runtime-throughput
      outcome: >-
        Five paired runs on byte-identical product v1 archives passed source
        CRC and malformed-input checks. Goose median throughput was 6.9%
        above C on Godot-real and 6.7% below C on mixed, within the 10% gate.
        Four-reader/32 MiB defaults were exercised; measurements are scoped to
        one Linux host and do not validate the production CMake or other platforms.
      results: docs/research/experiments/v1-runtime-throughput/results.md
    - hypothesis: H3-runtime
      outcome: >-
        Goose/native and C readers passed source-byte and malformed-input
        checks. Goose median throughput was 27.4% below C on the real corpus
        and 12.1% below C on mixed, missing the maximum 10% gap. Queue/allocation
        overhead and a practical per-reader memory budget need follow-up.
      results: docs/research/experiments/h3-runtime-lookup/results.md
    - hypothesis: H2
      outcome: >-
        Large high-entropy and mixed controls met the chunking gain/cost rule;
        the full hypothesis remains inconclusive for a default because the real
        Godot corpus showed no material granularity advantage and repetitive
        large inputs compressed much worse when split into frames.
      results: docs/research/experiments/h2-frame-granularity/results.md
    - hypothesis: H3-pack
      outcome: >-
        The native Goose pack path met the gain/cost rule on all large controls:
        peak RSS fell 92.2–95.6% versus Goose whole-file processing and median
        throughput was not more than 10% below the C reference. Indexed H3
        runtime correctness passed, but its throughput gate failed.
      results: docs/research/experiments/h3-native-streaming-boundary/results.md
    - hypothesis: H1
      outcome: >-
        Metadata staging met the predeclared gain/cost rule in five large
        high-entropy configurations, especially at 16 workers, but did not
        qualify on the real corpus or large compressible controls. The evidence
        supports selective staging rather than a general default.
      results: docs/research/experiments/h1-queue-payload-cost/results.md
  next:
    - issue: .scratch/gpack-foundation/issues/23-platform-release-gate.md
      action: Validate the native build and correctness matrix on Linux, macOS, and Windows.
evaluation:
  baseline: Product v1 runtime performance measured on Linux; cross-platform validation is in progress.
  metrics:
    - archive correctness and deterministic byte equality
    - pack and full-asset read throughput and latency
    - peak resident memory
    - compression ratio
    - full-asset lookup throughput and latency, including concurrent reads
    - malformed archive rejection
  status: Issues 17–22 are implemented; issue 23's production CMake build and fixtures pass on Linux. Native macOS/Windows CI and cross-platform golden-byte identity remain unverified.
next_action: >-
