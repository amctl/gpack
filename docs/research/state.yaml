project: gpack
question: >-
  What build-time archive and runtime lookup design best serves Goose game/runtime
  assets with random access, safe paths, reproducible builds, and a maintainable
  cross-platform implementation?
status: implementation_in_progress
updated: 2026-11-24
scope:
  - Review the existing docs/product/proposal.md proposal against primary-source prior art.
  - Inspect the bundled Goose language docs, stdlib, and sample programs.
  - Identify architecture constraints, risks, and testable next hypotheses.
current_understanding: >-
  Issues 17–22 have implemented the v1 product and measured runtime
  performance on Linux. H1, H2, and both H3 experiments are complete; indexed
  H3 runtime lookup passed correctness but missed its throughput gate. Issue 22's product v1 benchmark
  later met the median throughput gate on the measured Linux build after a
  byte-table CRC update and a bounded one-shot decoder for small frames. H3 supports a native streaming
  pack boundary on large controls, while H1 supports selective staging for
  large high-entropy payloads at higher worker counts. Neither result selects
  a general packing concurrency default.
  V1 is a build-time CLI plus runtime API for complete asset reads by normalized
  path, using a separately distributable read-only archive with concurrent
  readers; the application replaces whole archives outside gpack. The user
  selected a new versioned format, Goose desktop platforms, regular-file inputs,
  safe normalized paths, omitted source timestamps/permissions, duplicate-path
  rejection, source-mutation failure, pinned-build byte reproducibility, and
  accidental corruption detection without authenticity claims. V1 scope is
  pack/list/verify plus complete path reads, one pinned Zstandard codec with
  raw fallback, CRC32 integrity, no deduplication, and a configurable 32 MiB
  per-asset default with four concurrent reads. Primary-source
  research shows random access alone does not justify a custom format. Goose
  v2026.4 makes native streaming I/O a candidate for bounded-memory large-file
  handling; H3 measured material pack-side gains, while runtime positional
  lookup is functional but missed the preregistered throughput gap. The verified benchmark
  corpus is one MIT Godot 4.7 demo each from 2D, 3D, and audio; the 3D project's
  CC0 checker notice is retained. The repository plan keeps format ownership
  in Goose and limits native code to I/O/Zstandard; it pins Goose v2026.4 and
  targets native Linux/GCC, macOS/Apple Clang, and Windows/MSVC builds.
